# Render Blueprint: deploys the FastAPI backend. Set secrets in the Render dashboard.
services:
  - type: web
    name: govform-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://your-site.netlify.app
      - key: PYTHON_VERSION
        value: 3.11.9
